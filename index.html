<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GWS AI Chatbot Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0f172a url('website-screenshot.png') no-repeat top center;
      background-size: cover;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: relative;
    }

    /* Top Right Corner Blue Box */
    .demo-badge {
      position: fixed;
      top: 16px;
      right: 20px;
      background: #0052cc;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(0, 82, 204, 0.4);
      z-index: 1000;
      letter-spacing: 0.3px;
    }

    /* 3 Floating / Transparent Chat Widget Areas */
    .widgets-container {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      padding: 20px;
      width: 100%;
    }

    /* Compact, transparent widget card without white background or border */
    .widget-card {
      width: 300px;
      height: 440px;
      background: transparent;
      border: none;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .widget-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }

    /* Responsive for smaller screens */
    @media (max-width: 950px) {
      .widgets-container {
        flex-direction: column;
        align-items: center;
      }
      .widget-card {
        width: 100%;
        max-width: 320px;
        height: 380px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Right Blue Box -->
  <div class="demo-badge">GWS AI Chatbot Demo</div>

  <!-- 3 Transparent, Compact Widget Slots -->
  <main class="widgets-container">

    <!-- Widget 1 -->
    <div class="widget-card">
      <iframe class="widget-frame" src="widget1.html" allowtransparency="true"></iframe>
    </div>

    <!-- Widget 2 -->
    <div class="widget-card">
      <iframe class="widget-frame" src="widget2.html" allowtransparency="true"></iframe>
    </div>

    <!-- Widget 3 -->
    <div class="widget-card">
      <iframe class="widget-frame" src="widget3.html" allowtransparency="true"></iframe>
    </div>

  </main>

</body>
</html>
