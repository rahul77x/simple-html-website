<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Amazon Connect Widget 1</title>
  <style>
    :root {
      --theme-color: #0052cc;
      --theme-hover: #0747a6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      width: 100%;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 12px;
    }

    /* Floating Chat Launcher Button (Simulates Amazon Connect launcher) */
    .sample-launcher-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--theme-color);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .sample-launcher-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.4);
    }

    .sample-launcher-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    /* Sample Chat Window (Simulates Amazon Connect chat window) */
    .sample-chat-window {
      display: none;
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(0, 0, 0, 0.12);
      flex-direction: column;
      overflow: hidden;
      animation: slideIn 0.25s ease-out;
    }

    .sample-chat-window.open {
      display: flex;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Chat Header */
    .chat-header {
      background: var(--theme-color);
      color: white;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
    }

    .chat-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
    }

    .chat-subtitle {
      font-size: 10.5px;
      opacity: 0.85;
    }

    .chat-close-btn {
      background: transparent;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
      opacity: 0.85;
      transition: opacity 0.2s;
    }

    .chat-close-btn:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.15);
    }

    /* Chat Messages Container */
    .chat-messages {
      flex: 1;
      padding: 12px;
      background: #f8fafc;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-bubble {
      max-width: 84%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .chat-bubble.bot {
      background: #e2e8f0;
      color: #1e293b;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .chat-bubble.user {
      background: var(--theme-color);
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    /* Quick Reply Chips */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .quick-reply-pill {
      background: #ffffff;
      border: 1px solid var(--theme-color);
      color: var(--theme-color);
      font-size: 10.5px;
      padding: 3px 8px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s;
    }

    .quick-reply-pill:hover {
      background: var(--theme-color);
      color: white;
    }

    /* Chat Input Area */
    .chat-input-bar {
      padding: 8px 10px;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .chat-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 20px;
      font-size: 12px;
      outline: none;
    }

    .chat-input:focus {
      border-color: var(--theme-color);
    }

    .chat-send-btn {
      background: var(--theme-color);
      color: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .chat-send-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <!-- ======================================================== -->
  <!-- 1. REAL AMAZON CONNECT SNIPPET (PASTE BELOW WHEN READY)  -->
  <!-- When you paste your real script below, the sample demo   -->
  <!-- widget will automatically hide itself.                   -->

  <!-- ======================================================== -->
  <!-- 2. SAMPLE DEMO WIDGET (Active for testing & demoing)     -->
  <!-- ======================================================== -->
  <div id="sample-widget-container" style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end;">

    <!-- Floating Circular Launcher Button -->
    <button id="sample-launcher" class="sample-launcher-btn" title="Open Chat (Native Connect Agent)">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
    </button>

    <!-- Simulated Chat Window -->
    <div id="sample-window" class="sample-chat-window">
      <div class="chat-header">
        <div class="chat-title-wrap">
          <div class="status-dot"></div>
          <div>
            <div class="chat-title">BOI Assistant (Native)</div>
            <div class="chat-subtitle">Amazon Connect AI Agent</div>
          </div>
        </div>
        <button id="sample-close" class="chat-close-btn" aria-label="Close" title="Close Chat">&times;</button>
      </div>

      <div class="chat-messages" id="chat-messages">
        <div class="chat-bubble bot">
          <strong>Welcome to Bank of India.</strong><br>
          I am powered by the <em>Amazon Connect Native Web Crawler & Inbuilt Knowledge Base</em>.<br><br>
          How can I assist you today?
          <div class="quick-replies">
            <span class="quick-reply-pill" onclick="sendReply('Fixed Deposit Interest Rates')">FD Rates</span>
            <span class="quick-reply-pill" onclick="sendReply('Branch Timings')">Branch Hours</span>
            <span class="quick-reply-pill" onclick="sendReply('Debit Card Services')">Card Services</span>
          </div>
        </div>
      </div>

      <div class="chat-input-bar">
        <input type="text" id="chat-input" class="chat-input" placeholder="Type a message..." autocomplete="off">
        <button id="chat-send" class="chat-send-btn" title="Send">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- State Detector & Sample Widget Script -->
  <script>
    (function(){
      const container = document.getElementById('sample-widget-container');
      const launcher = document.getElementById('sample-launcher');
      const windowElem = document.getElementById('sample-window');
      const closeBtn = document.getElementById('sample-close');
      const inputElem = document.getElementById('chat-input');
      const sendBtn = document.getElementById('chat-send');
      const messagesElem = document.getElementById('chat-messages');

      // Continuous detector for real Amazon Connect widget state
      let lastOpenState = false;
      function notifyParent(isOpen) {
        if (isOpen !== lastOpenState) {
          lastOpenState = isOpen;
          window.parent.postMessage({
            type: 'CHAT_STATE_CHANGED',
            widgetIndex: 1,
            isOpen: isOpen
          }, '*');
        }
      }

      function checkWidgetState() {
        // 1. Detect real Amazon Connect hosted iframe state
        const connectFrame = document.getElementById('amazon-connect-widget-frame') ||
                             document.querySelector('iframe[id*="amazon-connect"]') ||
                             document.querySelector('.amazon-connect-chat-interface');
        if (connectFrame) {
          const isOpen = connectFrame.classList.contains('show') || (connectFrame.offsetHeight > 140);
          notifyParent(isOpen);
          return;
        }

        // 2. Detect sample demo widget state
        if (windowElem) {
          const isOpen = windowElem.classList.contains('open');
          notifyParent(isOpen);
        }
      }

      setInterval(checkWidgetState, 200);

      const observer = new MutationObserver(checkWidgetState);
      observer.observe(document.body, { attributes: true, subtree: true, attributeFilter: ['class', 'style'] });

      // If real Amazon Connect snippet is active, hide sample UI
      if (typeof amazon_connect === 'function' || window.amazon_connect) {
        if (container) container.style.display = 'none';
        if (typeof amazon_connect === 'function') {
          amazon_connect('registerCallback', {
            'WIDGET_FRAME_CLOSED': function() { notifyParent(false); }
          });
        }
        return;
      }

      function openChat() {
        launcher.style.display = 'none';
        windowElem.classList.add('open');
        notifyParent(true);
      }

      function closeChat() {
        windowElem.classList.remove('open');
        launcher.style.display = 'flex';
        notifyParent(false);
      }

      launcher.addEventListener('click', openChat);
      closeBtn.addEventListener('click', closeChat);

      window.sendReply = function(text) {
        addUserMessage(text);
        simulateBotResponse(text);
      };

      function addUserMessage(text) {
        const bubble = document.createElement('div');
        bubble.className = 'chat-bubble user';
        bubble.textContent = text;
        messagesElem.appendChild(bubble);
        messagesElem.scrollTop = messagesElem.scrollHeight;
      }

      function addBotMessage(text) {
        const bubble = document.createElement('div');
        bubble.className = 'chat-bubble bot';
        bubble.innerHTML = text;
        messagesElem.appendChild(bubble);
        messagesElem.scrollTop = messagesElem.scrollHeight;
      }

      function simulateBotResponse(query) {
        setTimeout(() => {
          const lower = query.toLowerCase();
          if (lower.includes('rate') || lower.includes('fd')) {
            addBotMessage("<strong>[Connect Native KB]</strong><br>Our 1 to 2-year Domestic Term Deposit interest rate is <strong>6.80% p.a.</strong> (7.30% for senior citizens).");
          } else if (lower.includes('branch') || lower.includes('hour') || lower.includes('time')) {
            addBotMessage("<strong>[Connect Native KB]</strong><br>Bank of India branches operate Monday through Saturday from <strong>10:00 AM to 4:00 PM</strong> (closed 2nd & 4th Saturdays).");
          } else if (lower.includes('card') || lower.includes('block')) {
            addBotMessage("<strong>[Connect Native KB]</strong><br>To instantly hotlist/block your debit card, SMS <code>BLOCK &lt;Last 4 digits&gt;</code> to 567676 or call toll-free 1800 103 1906.");
          } else {
            addBotMessage(`<strong>[Connect Native KB]</strong><br>Response generated for: "<em>${query}</em>" using the built-in Connect web crawler.`);
          }
        }, 500);
      }

      sendBtn.addEventListener('click', () => {
        if (inputElem.value.trim()) {
          const txt = inputElem.value.trim();
          addUserMessage(txt);
          inputElem.value = '';
          simulateBotResponse(txt);
        }
      });

      inputElem.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && inputElem.value.trim()) {
          const txt = inputElem.value.trim();
          addUserMessage(txt);
          inputElem.value = '';
          simulateBotResponse(txt);
        }
      });
    })();
  </script>
</body>
</html>
